<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#10141a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00D9FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <line x1="0" y1="279" x2="1200" y2="279" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="1"/>

  <text x="600" y="120" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#00D9FF" opacity="0.85">&gt; whoami</text>

  <text x="600" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#dfe2eb" filter="url(#textGlow)">
    Muhammad <tspan fill="#00D9FF">Umer Shahid</tspan>
  </text>

  <text x="600" y="205" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="16" letter-spacing="2" fill="#8b9aa3">
    FULL-STACK DEVELOPER · REACT · NODE.JS · WORDPRESS
  </text>

  <text x="600" y="240" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#00D9FF" opacity="0.6">
    Islamabad, Pakistan
  </text>
</svg>
